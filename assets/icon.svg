<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2025"/>
      <stop offset="100%" stop-color="#0f1012"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3344"/>
      <stop offset="100%" stop-color="#cc0818"/>
    </linearGradient>
    <linearGradient id="colorRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2244"/>
      <stop offset="33%" stop-color="#00ff88"/>
      <stop offset="66%" stop-color="#00aaff"/>
      <stop offset="100%" stop-color="#ff00aa"/>
    </linearGradient>
  </defs>
  <!-- Rounded Base Plate -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)" stroke="#32363f" stroke-width="3"/>
  <!-- Radeon Accent Corner -->
  <polygon points="100,16 112,16 112,28" fill="#e01122"/>
  <!-- Monitor Outline -->
  <rect x="28" y="28" width="72" height="48" rx="8" fill="none" stroke="#505560" stroke-width="4"/>
  <rect x="34" y="34" width="60" height="36" rx="4" fill="#181a1f"/>
  <!-- Color Wheel / Spectrum inside Monitor -->
  <circle cx="64" cy="52" r="14" fill="none" stroke="url(#colorRing)" stroke-width="5"/>
  <circle cx="64" cy="52" r="5" fill="#ffffff"/>
  <!-- Monitor Stand -->
  <path d="M58 76 L54 90 L74 90 L70 76 Z" fill="#505560"/>
  <rect x="46" y="90" width="36" height="4" rx="2" fill="#707580"/>
  <!-- Vibrance Sliders Graphic in Bottom Corner -->
  <circle cx="94" cy="94" r="14" fill="url(#redGrad)"/>
  <path d="M90 94 L98 94 M94 90 L94 98" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
</svg>
